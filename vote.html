<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE AI INSIGHT - 주제 투표</title>
<style>
  body { margin:0; background:#f4f4f5; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans KR',sans-serif; word-break:keep-all; }
  .card { max-width:460px; margin:48px auto; background:#fff; border-radius:14px; box-shadow:0 2px 12px rgba(15,23,42,.08); padding:36px 28px; text-align:center; }
  .eyebrow { font-size:11px; font-weight:800; letter-spacing:3px; color:#4f46e5; text-transform:uppercase; }
  h1 { font-size:22px; color:#0f172a; margin:12px 0 8px; line-height:1.35; }
  .pick { display:inline-block; margin:14px 0 6px; padding:10px 18px; border-radius:20px; background:#eef2ff; color:#4f46e5; font-weight:700; font-size:14px; }
  p { color:#6b7280; font-size:14px; line-height:1.7; margin:8px 0 0; }
  a { color:#6b7280; }
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">✦ Monthly Special</div>
  <h1>투표가 반영되었습니다</h1>
  <div class="pick" id="pick">선택한 주제</div>
  <p id="msg">결과는 다음 달 월간호에서 알려드립니다.</p>
  <p style="margin-top:20px;"><a href="archive.html">지난 호 보기</a></p>
</div>
<script>
  // 집계는 메일 발송 시 링크 추적(클릭 기록)으로 이뤄지므로 이 페이지는 안내만 한다.
  // ?t=1~4 선택 번호, ?l=라벨(선택), ?m=YYYYMM 월간호
  (function () {
    var q = new URLSearchParams(location.search);
    var l = q.get('l'), t = q.get('t'), m = q.get('m');
    var pick = document.getElementById('pick');
    if (l) pick.textContent = l;
    else if (t) pick.textContent = '주제 ' + t;
    else pick.style.display = 'none';
    if (m && /^\d{6}$/.test(m)) {
      var y = +m.slice(0, 4), mo = +m.slice(4, 6);
      var ny = mo === 12 ? y + 1 : y, nm = mo === 12 ? 1 : mo + 1;
      document.getElementById('msg').textContent = '결과는 ' + ny + '년 ' + nm + '월 월간호에서 알려드립니다. 한 분당 마지막 선택 한 표만 집계합니다.';
    }
  })();
</script>
</body>
</html>
